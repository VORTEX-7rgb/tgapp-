<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamX - High-Speed Pure Engine</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-left">
        <div class="logo-wrap">
          <span class="logo-badge">STREAM<b>X</b></span>
          <span class="site-badge">SXYPRN</span>
        </div>
        <div class="status-wrap">
          <span class="status-dot online"></span>
          <span class="status-text">PURE-MATH V2 READY</span>
        </div>
      </div>
      <div class="search-box">
        <input type="text" id="stream-url-input" placeholder="Paste SxyPrn video URL or post ID (e.g. 6ad0a97b8f89e)...">
        <button id="inspect-btn">Stream</button>
      </div>
    </header>

    <!-- Category Tabs -->
    <nav class="categories-bar">
      <button class="cat-chip active" data-cat="trending">🔥 Trending</button>
      <button class="cat-chip" data-cat="Hardcore">Hardcore</button>
      <button class="cat-chip" data-cat="MILF">MILF</button>
      <button class="cat-chip" data-cat="BigTits">Big Tits</button>
      <button class="cat-chip" data-cat="Blowjob">Blowjob</button>
      <button class="cat-chip" data-cat="Anal">Anal</button>
      <button class="cat-chip" data-cat="POV">POV</button>
      <button class="cat-chip" data-cat="Indian">Indian</button>
      <button class="cat-chip" data-cat="Creampie">Creampie</button>
      <button class="cat-chip" data-cat="Amateur">Amateur</button>
    </nav>

    <!-- Player Section -->
    <section id="player-container" class="player-container hidden">
      <div class="player-card">
        <div class="player-wrap">
          <video id="video-element" controls playsinline preload="auto"></video>
          <div id="player-loader" class="player-loader hidden">
            <div class="spinner"></div>
            <p id="player-status-text">Resolving stream...</p>
          </div>
        </div>
        <div class="player-meta">
          <div class="meta-info">
            <h3 id="current-video-title">Now Playing</h3>
            <span id="current-video-cdn" class="cdn-badge">Direct High-Speed Pipeline</span>
          </div>
          <div class="player-actions">
            <button id="copy-stream-btn" class="action-btn">📋 Copy Stream URL</button>
            <button id="close-player-btn" class="close-btn">✕ Close</button>
          </div>
        </div>

        <!-- Recommended Videos Tray -->
        <div id="related-section" class="related-section hidden">
          <h4 class="related-title">Recommended Next</h4>
          <div id="related-tray" class="related-tray"></div>
        </div>
      </div>
    </section>

    <!-- Feed Grid -->
    <main class="feed-section">
      <div class="section-header">
        <h2 id="feed-title">Trending Videos</h2>
        <span id="feed-stats" class="badge">Loading...</span>
      </div>
      <div id="video-grid" class="video-grid">
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Connecting to StreamX VPS Bridge & SxyPrn Engine...</p>
        </div>
      </div>
      <div id="infinite-loader" class="infinite-loader hidden">
        <div class="spinner-small"></div>
        <span>Loading next page...</span>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
