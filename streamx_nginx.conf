proxy_cache_path /dev/shm/nginx_streamx_cache levels=1:2 keys_zone=streamx_edge:50m max_size=2g inactive=2h use_temp_path=off;

server {
    listen 127.0.0.1:8088;
    server_name localhost;

    # Performance buffers
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    large_client_header_buffers 4 32k;

    # 1. Static Web App Files (C-speed sub-millisecond delivery)
    location / {
        root /var/www/streamx_public;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin * always;
    }

    # 2. General API Routing (Health, Feed, Stream Resolver)
    location /api/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # 3. StreamX Video Streaming Engine (Instant Seek, Zero Buffering Delay)
    location = /api/play {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        
        # Turn off buffering so seeks stream instantly to player
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_ignore_client_abort off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        
        # Range headers forwarding
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
    }
}
